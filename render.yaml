services:
  - type: web
    name: summit-air-demo
    runtime: python
    region: virginia
    plan: free
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev
    startCommand: .venv/bin/uvicorn revin_take_home.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: UV_VERSION
        value: 0.10.9
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
