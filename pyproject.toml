[project]
name = "revin-take-home"
version = "0.1.0"
description = "Summit Air inbound voice agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "phonenumbers>=9,<10",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "revin_take_home/prompts"
"tools" = "revin_take_home/tools"
"config" = "revin_take_home/config"
"evals" = "revin_take_home/evals"
